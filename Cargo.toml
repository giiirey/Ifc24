[package]
name = "ifctauri"
version = "0.1.0"
description = "IFC Model Visualizer"
authors = ["Igor"]
edition = "2021"

[lib]
name = "ifctauri_lib"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "ifctauri"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["wry"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
serde_bytes = "0.11"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
dashmap = "6"
lru = "0.14"
bytemuck = "1"
nalgebra = "0.33"
rayon = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
native-dialog = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
cc = "1"
bindgen = "0.71"
